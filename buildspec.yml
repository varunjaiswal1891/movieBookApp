# ─────────────────────────────────────────────────────────────────────────────
# AWS CodeBuild – Build backend JAR + frontend, deploy frontend to S3, output for CodeDeploy
# Environment variables from Terraform: ARTIFACTS_BUCKET, FRONTEND_BUCKET, CLOUDFRONT_DIST_ID
# ─────────────────────────────────────────────────────────────────────────────

version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20
    commands:
      - echo "Installing dependencies..."

  pre_build:
    commands:
      - echo "Pre-build started at $(date)"
      - cd movie-booking-frontend && npm ci && cd ..

  build:
    commands:
      - echo "Building Spring Boot backend..."
      - cd movie-booking-backend && mvn package -DskipTests -q && cd ..

      - echo "Building React frontend..."
      - cd movie-booking-frontend && VITE_API_BASE_URL="${VITE_API_BASE_URL:-/api}" npm run build && cd ..

      - echo "Preparing CodeDeploy revision..."
      - mkdir -p deploy/scripts
      - |
        if [ -n "${CODEPIPELINE_BRANCH:-}" ]; then
          BREF="${CODEPIPELINE_BRANCH#refs/heads/}"
          if [ "$BREF" = "${GITHUB_BRANCH_PRIMARY}" ] || [ "$CODEPIPELINE_BRANCH" = "${GITHUB_BRANCH_PRIMARY}" ]; then
            SPRING_PROFILE_SELECTED="${SPRING_PROFILE_PRIMARY:-stage}"
          elif [ -n "${GITHUB_BRANCH_SECONDARY}" ] && { [ "$BREF" = "${GITHUB_BRANCH_SECONDARY}" ] || [ "$CODEPIPELINE_BRANCH" = "${GITHUB_BRANCH_SECONDARY}" ]; }; then
            SPRING_PROFILE_SELECTED="${SPRING_PROFILE_SECONDARY:-stage}"
          else
            echo "Unknown branch from pipeline: ${CODEPIPELINE_BRANCH}; using SPRING_PROFILES_ACTIVE"
            SPRING_PROFILE_SELECTED="${SPRING_PROFILES_ACTIVE:-stage}"
          fi
        else
          SPRING_PROFILE_SELECTED="${SPRING_PROFILES_ACTIVE:-stage}"
        fi
        echo "Spring profile for this revision: $SPRING_PROFILE_SELECTED (branch=${CODEPIPELINE_BRANCH:-local})"
        printf '%s' "$SPRING_PROFILE_SELECTED" > deploy/spring-profile
      - cp movie-booking-backend/target/movie-booking-backend.jar deploy/app.jar
      - cp appspec.yml deploy/
      - cp scripts/codedeploy/*.sh deploy/scripts/
      - chmod +x deploy/scripts/*.sh

  post_build:
    commands:
      # Artifacts bucket: same path EC2 userdata/start.sh uses (optional manual pull)
      - echo "Publishing backend JAR to artifacts bucket..."
      - aws s3 cp movie-booking-backend/target/movie-booking-backend.jar "s3://$ARTIFACTS_BUCKET/movie-booking-backend.jar"

      - echo "Deploying frontend to S3..."
      - aws s3 sync movie-booking-frontend/dist/ "s3://$FRONTEND_BUCKET/" --delete

      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DIST_ID" --paths "/*" || true

artifacts:
  files:
    - '**/*'
  base-directory: deploy
  name: BuildArtifact
